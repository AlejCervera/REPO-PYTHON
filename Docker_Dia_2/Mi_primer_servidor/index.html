<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Snake</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #0a0a1a;
      --neon: #39ff14;
      --rosa: #ff2e88;
      --cian: #00e5ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 16px;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      background: radial-gradient(ellipse at top, #1a1040 0%, var(--fondo) 70%);
      overflow-x: hidden;
    }

    h1 {
      font-size: clamp(1.4rem, 6vw, 2.6rem);
      color: var(--neon);
      text-shadow: 0 0 8px var(--neon), 0 0 24px var(--neon);
      animation: parpadeo 3s infinite;
    }
    @keyframes parpadeo {
      0%, 92%, 100% { opacity: 1; }
      94% { opacity: 0.4; }
      96% { opacity: 1; }
      98% { opacity: 0.6; }
    }

    .marcador {
      display: flex;
      gap: 2rem;
      font-size: 0.8rem;
    }
    .marcador span { color: var(--cian); text-shadow: 0 0 6px var(--cian); }

    .tablero {
      position: relative;
      width: min(420px, 92vw);
      aspect-ratio: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 3px solid var(--rosa);
      border-radius: 8px;
      box-shadow: 0 0 20px var(--rosa), inset 0 0 20px rgba(255, 46, 136, 0.3);
      background: #050510;
    }

    .pantalla {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      text-align: center;
      background: rgba(5, 5, 16, 0.85);
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.8;
    }
    .pantalla.oculta { display: none; }
    .pantalla h2 { color: var(--rosa); text-shadow: 0 0 10px var(--rosa); font-size: 1.1rem; }

    button {
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.9rem 1.4rem;
      color: var(--fondo);
      background: var(--neon);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 14px var(--neon);
      transition: transform 0.1s;
    }
    button:hover { transform: scale(1.06); }
    button:active { transform: scale(0.96); }

    .ayuda { font-size: 0.6rem; color: #888; text-align: center; line-height: 1.8; }

    /* Cruceta para móvil */
    .cruceta {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 6px;
    }
    .cruceta button {
      padding: 0;
      font-size: 1.2rem;
      background: transparent;
      color: var(--cian);
      border: 2px solid var(--cian);
      box-shadow: 0 0 8px var(--cian);
    }
    .cruceta .arriba { grid-column: 2; }
    .cruceta .izq { grid-column: 1; grid-row: 2; }
    .cruceta .abajo { grid-column: 2; grid-row: 2; }
    .cruceta .der { grid-column: 3; grid-row: 2; }
    @media (hover: hover) { .cruceta { display: none; } }
  </style>
</head>
<body>

  <h1>NEON SNAKE</h1>

  <div class="marcador">
    <div>PUNTOS <span id="puntos">0</span></div>
    <div>RÉCORD <span id="record">0</span></div>
  </div>

  <div class="tablero">
    <canvas id="lienzo" width="420" height="420"></canvas>

    <div class="pantalla" id="pantalla">
      <h2 id="titulo">¿LISTO?</h2>
      <p id="mensaje">Come las bolitas<br>y no te muerdas</p>
      <button id="jugar">JUGAR</button>
    </div>
  </div>

  <div class="cruceta">
    <button class="arriba" data-dir="arriba">▲</button>
    <button class="izq" data-dir="izq">◀</button>
    <button class="abajo" data-dir="abajo">▼</button>
    <button class="der" data-dir="der">▶</button>
  </div>

  <p class="ayuda">Flechas o WASD para moverte · Espacio para pausar</p>

  <script>
    const lienzo = document.getElementById('lienzo');
    const ctx = lienzo.getContext('2d');
    const CELDAS = 21;
    const TAM = lienzo.width / CELDAS;

    const DIRECCIONES = {
      arriba: { x: 0, y: -1 },
      abajo: { x: 0, y: 1 },
      izq: { x: -1, y: 0 },
      der: { x: 1, y: 0 },
    };
    const TECLAS = {
      ArrowUp: 'arriba', w: 'arriba', W: 'arriba',
      ArrowDown: 'abajo', s: 'abajo', S: 'abajo',
      ArrowLeft: 'izq', a: 'izq', A: 'izq',
      ArrowRight: 'der', d: 'der', D: 'der',
    };

    let serpiente, dir, siguienteDir, comida, puntos, velocidad, temporizador, pausado, jugando;
    let particulas = [];

    let record = 0;
    try { record = Number(localStorage.getItem('neon-snake-record')) || 0; } catch (e) {}
    document.getElementById('record').textContent = record;

    function empezar() {
      serpiente = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = siguienteDir = DIRECCIONES.der;
      puntos = 0;
      velocidad = 130;
      pausado = false;
      jugando = true;
      particulas = [];
      document.getElementById('puntos').textContent = 0;
      document.getElementById('pantalla').classList.add('oculta');
      ponerComida();
      clearInterval(temporizador);
      temporizador = setInterval(paso, velocidad);
    }

    function ponerComida() {
      do {
        comida = { x: Math.floor(Math.random() * CELDAS), y: Math.floor(Math.random() * CELDAS) };
      } while (serpiente.some(p => p.x === comida.x && p.y === comida.y));
    }

    function paso() {
      if (pausado) return;
      dir = siguienteDir;
      const cabeza = { x: serpiente[0].x + dir.x, y: serpiente[0].y + dir.y };

      const fuera = cabeza.x < 0 || cabeza.y < 0 || cabeza.x >= CELDAS || cabeza.y >= CELDAS;
      const choca = serpiente.some(p => p.x === cabeza.x && p.y === cabeza.y);
      if (fuera || choca) return finDelJuego();

      serpiente.unshift(cabeza);

      if (cabeza.x === comida.x && cabeza.y === comida.y) {
        puntos += 10;
        document.getElementById('puntos').textContent = puntos;
        explosion(comida.x, comida.y);
        ponerComida();
        // Cada vez un poco más rápido
        velocidad = Math.max(55, velocidad - 4);
        clearInterval(temporizador);
        temporizador = setInterval(paso, velocidad);
      } else {
        serpiente.pop();
      }
    }

    function explosion(cx, cy) {
      for (let i = 0; i < 18; i++) {
        const ang = Math.random() * Math.PI * 2;
        const v = 1 + Math.random() * 3;
        particulas.push({
          x: (cx + 0.5) * TAM, y: (cy + 0.5) * TAM,
          vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
          vida: 1,
        });
      }
    }

    function finDelJuego() {
      jugando = false;
      clearInterval(temporizador);
      let texto = `Puntos: ${puntos}`;
      if (puntos > record) {
        record = puntos;
        try { localStorage.setItem('neon-snake-record', record); } catch (e) {}
        document.getElementById('record').textContent = record;
        texto += '<br>¡NUEVO RÉCORD!';
      }
      mostrarPantalla('GAME OVER', texto, 'OTRA VEZ');
    }

    function mostrarPantalla(titulo, mensaje, boton) {
      document.getElementById('titulo').textContent = titulo;
      document.getElementById('mensaje').innerHTML = mensaje;
      document.getElementById('jugar').textContent = boton;
      document.getElementById('pantalla').classList.remove('oculta');
    }

    function cambiarDir(nombre) {
      const nueva = DIRECCIONES[nombre];
      // No se puede dar la vuelta sobre uno mismo
      if (nueva.x === -dir.x && nueva.y === -dir.y) return;
      siguienteDir = nueva;
    }

    // Bucle de dibujo (va a 60fps, independiente de la lógica)
    function dibujar(t) {
      ctx.fillStyle = '#050510';
      ctx.fillRect(0, 0, lienzo.width, lienzo.height);

      // Rejilla suave
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.06)';
      for (let i = 1; i < CELDAS; i++) {
        ctx.beginPath(); ctx.moveTo(i * TAM, 0); ctx.lineTo(i * TAM, lienzo.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * TAM); ctx.lineTo(lienzo.width, i * TAM); ctx.stroke();
      }

      if (serpiente) {
        // Comida que late
        const latido = 0.35 + Math.sin(t / 150) * 0.06;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff2e88';
        ctx.fillStyle = '#ff2e88';
        ctx.beginPath();
        ctx.arc((comida.x + 0.5) * TAM, (comida.y + 0.5) * TAM, TAM * latido, 0, Math.PI * 2);
        ctx.fill();

        // Serpiente con degradado de color
        ctx.shadowColor = '#39ff14';
        serpiente.forEach((p, i) => {
          const tono = 110 + (i / serpiente.length) * 80;
          ctx.fillStyle = i === 0 ? '#ccffcc' : `hsl(${tono}, 100%, 55%)`;
          ctx.shadowBlur = i === 0 ? 20 : 10;
          ctx.beginPath();
          ctx.roundRect(p.x * TAM + 1.5, p.y * TAM + 1.5, TAM - 3, TAM - 3, 5);
          ctx.fill();
        });
        ctx.shadowBlur = 0;
      }

      // Partículas
      particulas = particulas.filter(p => p.vida > 0);
      particulas.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vida -= 0.03;
        ctx.fillStyle = `rgba(255, 46, 136, ${p.vida})`;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      });

      if (pausado && jugando) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, lienzo.width, lienzo.height);
        ctx.fillStyle = '#00e5ff';
        ctx.font = '20px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSA', lienzo.width / 2, lienzo.height / 2);
      }

      requestAnimationFrame(dibujar);
    }
    requestAnimationFrame(dibujar);

    // Controles
    document.getElementById('jugar').addEventListener('click', empezar);

    document.addEventListener('keydown', e => {
      if (TECLAS[e.key] && jugando) {
        e.preventDefault();
        cambiarDir(TECLAS[e.key]);
      } else if (e.key === ' ') {
        e.preventDefault();
        if (jugando) pausado = !pausado;
        else empezar();
      }
    });

    document.querySelectorAll('.cruceta button').forEach(b =>
      b.addEventListener('click', () => jugando && cambiarDir(b.dataset.dir))
    );

    // Deslizar el dedo sobre el tablero
    let toqueInicio = null;
    lienzo.addEventListener('touchstart', e => { toqueInicio = e.touches[0]; }, { passive: true });
    lienzo.addEventListener('touchend', e => {
      if (!toqueInicio || !jugando) return;
      const dx = e.changedTouches[0].clientX - toqueInicio.clientX;
      const dy = e.changedTouches[0].clientY - toqueInicio.clientY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      cambiarDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'der' : 'izq') : (dy > 0 ? 'abajo' : 'arriba'));
    });
  </script>

</body>
</html>
